# Configuration Langfuse — SANS SECRETS.
# Les secrets (salt, encryptionKey, nextauth, mots de passe DB) sont fournis
# par values-secrets.yaml (généré par ./generate.sh, ignoré par git).
#
# Installation :
#   helm upgrade --install langfuse langfuse/langfuse -n langfuse \
#     -f values-langfuse.yaml -f values-secrets.yaml --wait --timeout 15m

global:
  security:
    allowInsecureImages: true

langfuse:
  logging:
    level: info
    format: text

  features:
    telemetryEnabled: false
    signUpDisabled: false

  nextauth:
    url: "https://langfuse.example.com"

  ingress:
    enabled: true
    className: public
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: langfuse.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: langfuse-tls

  deployment:
    replicas: 1

  web:
    replicas: 2
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 50

  worker:
    replicas: 4
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    hpa:
      enabled: true
      minReplicas: 4
      maxReplicas: 12
      targetCPUUtilizationPercentage: 50

postgresql:
  deploy: true
  auth:
    username: postgres
    database: postgres_langfuse
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"

redis:
  deploy: true
  auth:
    username: default
  primary:
    extraFlags:
      - "--maxmemory-policy noeviction"
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

clickhouse:
  deploy: true
  shards: 1
  replicaCount: 1
  auth:
    username: default
  persistence:
    enabled: true
    size: 50Gi
  resourcesPreset: large

s3:
  deploy: true
  bucket: langfuse
  auth:
    rootUser: minio
  defaultBuckets: langfuse
  persistence:
    enabled: true
    size: 50Gi
